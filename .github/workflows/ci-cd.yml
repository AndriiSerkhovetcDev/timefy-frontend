name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to server
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate deployment configuration
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ADMIN_APP_URL: ${{ vars.VITE_ADMIN_APP_URL }}
        run: |
          test -n "$DEPLOY_PATH" || (echo "Repository variable DEPLOY_PATH is required" && exit 1)
          test -n "$DOCKER_IMAGE" || (echo "Repository variable DOCKER_IMAGE is required" && exit 1)
          test -n "$VITE_API_URL" || (echo "Repository variable VITE_API_URL is required" && exit 1)
          test -n "$VITE_ADMIN_APP_URL" || (echo "Repository variable VITE_ADMIN_APP_URL is required" && exit 1)

      - name: Build Docker image
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ADMIN_APP_URL: ${{ vars.VITE_ADMIN_APP_URL }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_ADMIN_APP_URL="$VITE_ADMIN_APP_URL" \
            --build-arg VITE_APP_VERSION="$IMAGE_TAG" \
            --tag "$DOCKER_IMAGE:$IMAGE_TAG" \
            .

      - name: Save Docker image
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker save "$DOCKER_IMAGE:$IMAGE_TAG" | gzip > app.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: app.tar.gz
          target: ${{ vars.DEPLOY_PATH }}

      - name: Deploy frontend with Docker Compose
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_PATH,DOCKER_IMAGE,IMAGE_TAG
          script: |
            set -eu
            archive="$DEPLOY_PATH/app.tar.gz"
            compose_file="$DEPLOY_PATH/docker-compose.yml"
            release_image="$DOCKER_IMAGE:$IMAGE_TAG"
            current_image="$DOCKER_IMAGE:latest"
            rollback_image="$DOCKER_IMAGE:rollback"
            previous_assets="$DEPLOY_PATH/.previous-assets-$IMAGE_TAG"
            previous_container=""

            cleanup() {
              if [ -n "$previous_container" ]; then
                docker rm -f "$previous_container" >/dev/null 2>&1 || true
              fi
              rm -rf "$previous_assets"
              rm -f "$archive"
            }

            rollback() {
              if docker image inspect "$rollback_image" >/dev/null 2>&1; then
                echo "Deployment failed; restoring previous frontend image"
                docker tag "$rollback_image" "$current_image"
                docker compose -f "$compose_file" up -d --no-build --force-recreate
              fi
            }

            trap 'status=$?; if [ "$status" -ne 0 ]; then rollback; fi; cleanup; exit "$status"' EXIT

            rm -rf "$previous_assets"
            mkdir -p "$previous_assets"

            if docker image inspect "$current_image" >/dev/null 2>&1; then
              docker tag "$current_image" "$rollback_image"
              previous_container=$(docker create "$rollback_image")
              docker cp "$previous_container:/usr/share/nginx/html/assets/." "$previous_assets/"
              docker rm "$previous_container" >/dev/null
              previous_container=""
            fi

            docker load < "$archive"
            docker tag "$release_image" "$current_image"
            docker compose -f "$compose_file" up -d --no-build --force-recreate

            container_id=$(docker compose -f "$compose_file" ps -q frontend)
            test -n "$container_id"

            if [ -n "$(find "$previous_assets" -mindepth 1 -print -quit)" ]; then
              docker cp "$previous_assets/." "$container_id:/usr/share/nginx/html/assets/"
            fi

            health_status="starting"
            attempt=0
            while [ "$attempt" -lt 12 ]; do
              health_status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
              if [ "$health_status" = "healthy" ]; then
                break
              fi
              if [ "$health_status" = "unhealthy" ]; then
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            test "$health_status" = "healthy"
            echo "Deployed frontend image $release_image"
